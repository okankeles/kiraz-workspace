server:
  port: 8080

spring:
  application:
    name: kiraz-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=MONTH,YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  mail:
    host: localhost
    port: 25
    username: test@kiraz.app
    password: testpassword
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
        debug: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: kiraz-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"

jwt:
  secret: "dummyTestSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLongForHmacSha256!"
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 14

paytr:
  merchant-id: "test-merchant-id"
  merchant-key: "test-merchant-key"
  merchant-salt: "test-merchant-salt"
  test-mode: "1"
  ok-url: "https://kiraz.app/payment-success"
  fail-url: "https://kiraz.app/payment-fail"
  timeout-limit: "30"

cloudinary:
  url: ""

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

kiraz:
  storage:
    upload-dir: target/test-uploads
  security:
    trusted-proxies: ""
