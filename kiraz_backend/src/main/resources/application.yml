server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: kiraz-backend
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: kiraz-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.ars.kirazbackend.*,com.ars.kirazbackend.event.*"

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 14

paytr:
  merchant-id: ${PAYTR_MERCHANT_ID}
  merchant-key: ${PAYTR_MERCHANT_KEY}
  merchant-salt: ${PAYTR_MERCHANT_SALT}
  test-mode: ${PAYTR_TEST_MODE:1}
  ok-url: ${PAYTR_OK_URL:https://kiraz.app/payment-success}
  fail-url: ${PAYTR_FAIL_URL:https://kiraz.app/payment-fail}
  timeout-limit: "30"

cloudinary:
  url: ${CLOUDINARY_URL:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
