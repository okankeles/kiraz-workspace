services:
  postgres:
    image: postgres:15-alpine
    container_name: kiraz_db
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-kiraz_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: